[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jh-clio-lib"
version = "0.1.0"
description = "Shared Clio/Lawmatics auth and request module for JH Law automations"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "google-cloud-firestore==2.20.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "responses==0.25.3",
]

[tool.setuptools.packages.find]
include = ["jh_clio_lib*"]
